{% load static %}
<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Créneaux - {{ skill_name }}</title>
    <link rel="stylesheet" href="{% static 'skills_shop/style.css' %}" />
  </head>
  <body>
    <a href="{% url 'index' %}">&larr; Retour</a>
    <h1>Créneaux pour "{{ skill_name }}"</h1>
    <ul id="liste-creneaux">
      {% for slot in slots %}
      <li>
        <strong>{{ slot.activity }}</strong>
        <span class="demande-creneau">{{ slot.slot|date:"d/m/Y H:i" }}</span>
      </li>
      {% empty %}
      <li class="liste-vide">Aucun créneau disponible pour cette compétence pour le moment.</li>
      {% endfor %}
    </ul>
  </body>
</html>
