{% load static %}
<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Inscription - Skills Shop</title>
    <link rel="stylesheet" href="{% static 'skills_shop/style.css' %}" />
  </head>
  <body>
    <div class="auth-page">
      <div class="auth-card">
        <a href="{% url 'index' %}" class="auth-back">&larr; Retour</a>
        <h1>Inscription</h1>
        <form method="post" action="{% url 'signup' %}">
          {% csrf_token %}
          {{ form.as_p }}
          <button type="submit">Sign Up</button>
        </form>
        <p class="auth-switch">Déjà un compte ? <a href="{% url 'login' %}">Se connecter</a></p>
      </div>
    </div>
  </body>
</html>
