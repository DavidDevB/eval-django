{% if user.is_authenticated %}
<p>Connecté en tant que {{ user.username }}</p>
<form method="post" action="{% url 'logout' %}">
  {% csrf_token %}
  <button type="submit">Se déconnecter</button>
</form>
{% else %}
<form method="post">
  {% csrf_token %} {{ form.as_p }}
  <button type="submit">Se connecter</button>
</form>
{% endif %}
